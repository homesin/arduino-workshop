<line x1="476" y1="520" x2="476" y2="620" stroke="#4f5d75" stroke-width="2"/>
<rect x="452" y="559" width="48" height="22" fill="#ffffff"/>
<text x="476" y="574" font-size="12" fill="#4f5d75" text-anchor="middle">GND</text>
<rect x="656" y="400" width="264" height="120" rx="6" fill="#fbf6e6" stroke="#b8a05c" stroke-width="1.5"/>
<text x="788.0" y="448" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="600">HC-SR501</text>
<text x="788.0" y="466" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">VCC、GND</text>
<text x="788.0" y="484" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">約 65 mA</text>
<line x1="788" y1="280" x2="788" y2="400" stroke="#e6a892" stroke-width="2"/>
<rect x="764" y="329" width="48" height="22" fill="#ffffff"/>
