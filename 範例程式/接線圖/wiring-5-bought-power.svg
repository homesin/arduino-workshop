<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 780" width="1840" height="780" role="img" aria-labelledby="buy2-t buy2-d" font-family="'Noto Sans TC','Source Han Sans TC','Microsoft JhengHei','微軟正黑體',sans-serif">
<title id="buy2-t">圖五、本次採購感測器接線：電源</title>
<desc id="buy2-d">電源分配圖。Uno 的 5V 與 GND 各以公對公杜邦線接到迷你麵包板電源軌，DHT11、HC-SR501、HC-SR04、LM393 光敏模組的 VCC 與 GND 從電源軌取電。</desc>
<rect width="1840" height="780" fill="#ffffff"/>
<text x="920.0" y="56" font-size="32" fill="#2d3142" text-anchor="middle" font-weight="500" font-family="'Noto Serif TC','Source Han Serif TC','Instrument Serif','PMingLiU','新細明體',serif">圖五、本次採購感測器接線：電源</text>
<text x="920.0" y="88" font-size="16" fill="#4f5d75" text-anchor="middle">四個感測器共用麵包板電源軌；Uno 只拉 5V 與 GND 兩條線（用公對公杜邦線）</text>
<rect x="88" y="220" width="200" height="460" rx="6" fill="#eaf1f8" stroke="#4a7fb0" stroke-width="1.5"/>
<text x="188.0" y="438" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="600">Arduino Uno R3</text>
<text x="188.0" y="456" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">USB 供電</text>
<text x="188.0" y="474" font-size="12" fill="#4f5d75" text-anchor="middle">上限約 500 mA</text>
<text x="104" y="285" font-size="16" fill="#d1461f" text-anchor="start" font-weight="600" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">5V</text>
<text x="104" y="625" font-size="16" fill="#2d3142" text-anchor="start" font-weight="600" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">GND</text>
<line x1="288" y1="280" x2="1544" y2="280" stroke="#d1461f" stroke-width="6" stroke-linecap="round"/>
<line x1="288" y1="620" x2="1544" y2="620" stroke="#2d3142" stroke-width="6" stroke-linecap="round"/>
<text x="344" y="260" font-size="16" fill="#d1461f" text-anchor="start" font-weight="600">＋ 5V 電源軌（迷你麵包板紅色線）</text>
<text x="344" y="656" font-size="16" fill="#2d3142" text-anchor="start" font-weight="600">－ GND 電源軌（迷你麵包板藍色線）</text>
<rect x="344" y="400" width="264" height="120" rx="6" fill="#fbf6e6" stroke="#b8a05c" stroke-width="1.5"/>
<text x="476.0" y="448" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="600">DHT11</text>
<text x="476.0" y="466" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">VCC、GND</text>
<text x="476.0" y="484" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">約 3 mA</text>
<line x1="476" y1="280" x2="476" y2="400" stroke="#e6a892" stroke-width="2"/>
<rect x="452" y="329" width="48" height="22" fill="#ffffff"/>
