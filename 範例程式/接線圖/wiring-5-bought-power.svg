<rect x="764" y="559" width="48" height="22" fill="#ffffff"/>
<text x="788" y="574" font-size="12" fill="#4f5d75" text-anchor="middle">GND</text>
<rect x="968" y="400" width="264" height="120" rx="6" fill="#fbf6e6" stroke="#b8a05c" stroke-width="1.5"/>
<text x="1100.0" y="448" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="600">HC-SR04</text>
<text x="1100.0" y="466" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">VCC、GND</text>
<text x="1100.0" y="484" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">約 15 mA</text>
<line x1="1100" y1="280" x2="1100" y2="400" stroke="#e6a892" stroke-width="2"/>
<rect x="1076" y="329" width="48" height="22" fill="#ffffff"/>
<text x="1100" y="344" font-size="12" fill="#4f5d75" text-anchor="middle">VCC</text>
<line x1="1100" y1="520" x2="1100" y2="620" stroke="#4f5d75" stroke-width="2"/>
<rect x="1076" y="559" width="48" height="22" fill="#ffffff"/>
<text x="1100" y="574" font-size="12" fill="#4f5d75" text-anchor="middle">GND</text>
<rect x="1280" y="400" width="264" height="120" rx="6" fill="#fbf6e6" stroke="#b8a05c" stroke-width="1.5"/>
<text x="1412.0" y="448" font-size="16" fill="#2d3142" text-anchor="middle" font-weight="600">LM393 光敏模組</text>
<text x="1412.0" y="466" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">VCC、GND</text>
<text x="1412.0" y="484" font-size="12" fill="#4f5d75" text-anchor="middle" font-family="'Geist Mono','Consolas','SFMono-Regular',monospace">約 5 mA</text>
<line x1="1412" y1="280" x2="1412" y2="400" stroke="#e6a892" stroke-width="2"/>
<rect x="1388" y="329" width="48" height="22" fill="#ffffff"/>
<text x="1412" y="344" font-size="12" fill="#4f5d75" text-anchor="middle">VCC</text>
<line x1="1412" y1="520" x2="1412" y2="620" stroke="#4f5d75" stroke-width="2"/>
<rect x="1388" y="559" width="48" height="22" fill="#ffffff"/>
<text x="1412" y="574" font-size="12" fill="#4f5d75" text-anchor="middle">GND</text>
<rect x="580" y="700" width="680" height="24" rx="6" fill="#fbeee9" stroke="#e6a892" stroke-width="1"/>
<text x="920" y="716" font-size="12" fill="#2d3142" text-anchor="middle" font-weight="600">四個感測器合計約 90 mA，遠低於 USB 的 500 mA，不需要外接電源</text>
<text x="88" y="744" font-size="12" fill="#4f5d75" text-anchor="start">電流為典型值估算，不是實測。迷你麵包板的電源軌有些在中間斷開，量一下或看紅藍線有無缺口。</text>
<text x="88" y="768" font-size="12" fill="#4f5d75" text-anchor="start">插電順序：先接 GND 軌，最後才接 5V 軌；插電前確認紅藍沒有接反。</text>
</svg>