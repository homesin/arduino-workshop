<style>
  :root{--bg:#E9EEE8;--ink:#143D2D;--accent:#87374B;--card:#fff;--line:#c9d3c8;--muted:#4a6358}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75;font-size:17px}

  .warn{border-color:var(--accent);background:#f6e9ec}

<div class="wrap">
  <header>
    <h1>領到套件，先點一點</h1>
    <p>每套共 9 項。照著下面一項一項對照實物，點一下就打勾；缺件或壞掉，馬上舉手跟講師換。</p>
  </header>
  <div class="note"><b>兩人一組共用一套。</b>套件是借用的，歸還方式請看現場說明。這份清單只用來確認東西有沒有到齊，勾選紀錄只存在你自己的瀏覽器。</div>

  <div class="bar"><span>已找到 <b id="cnt">0</b> / 9 項</span><button type="button" id="reset">全部取消勾選</button></div>
  <div id="ok"><b>九項都到齊了。</b>可以繼續下一步：<a href="install.html">一鍵安裝與驗收</a>。</div>

  <label class="item" data-k="usb">
    <input type="checkbox">

    <div><h2>USB 傳輸線<small>×1</small></h2><p>一頭方形（接 Uno）、一頭扁平（接電腦）。供電也傳程式，上傳不到板子先檢查它有沒有插緊。</p></div>
  </label>

    <input type="checkbox">

<script>
(function(){
  var items=[].slice.call(document.querySelectorAll('.item'));
  var KEY='kit-checklist-v1', saved={};
  try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  function refresh(){
    var n=0;
    items.forEach(function(it){var c=it.querySelector('input').checked;it.classList.toggle('done',c);if(c)n++});
    document.getElementById('cnt').textContent=n;
    document.getElementById('ok').style.display=n===items.length?'block':'none';
    var s={};items.forEach(function(it){if(it.querySelector('input').checked)s[it.dataset.k]=1});
    try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}
  }
  items.forEach(function(it){
    var c=it.querySelector('input');c.checked=!!saved[it.dataset.k];
    c.addEventListener('change',refresh);
  });
  document.getElementById('reset').addEventListener('click',function(){items.forEach(function(it){it.querySelector('input').checked=false});refresh()});
  refresh();
})();
</script>

<script>
(function () {
  // 只幫「指令」和「設定檔內容」加複製鈕；範例輸出（有 ✓、═ 等符號）不加。
  var CMD = /^((npm |cd |copy |irm |python |pwsh |winget |\$env:|"sk-)|codex( [A-Za-z-]+)*$)/;
  var ENV = /^[A-Z][A-Z0-9_]*=/;
  function isCommandBlock(text) {
    var lines = text.split('\n').map(function (l) { return l.trim(); })
      .filter(function (l) { return l && l.charAt(0) !== '#'; });
    if (!lines.length || /[✓✔✗═─]/.test(text)) return false;
    return lines.every(function (l) { return CMD.test(l) || ENV.test(l); });
  }
  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function flash(btn, ok) {
    var old = btn.getAttribute('data-label');
    btn.textContent = ok ? '已複製 ✓' : '請手動複製';
    btn.className = 'cpb' + (ok ? ' ok' : '');
    setTimeout(function () { btn.textContent = old; btn.className = 'cpb'; }, 1600);
  }
  function makeButton(getText) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'cpb'; b.textContent = '複製'; b.setAttribute('data-label', '複製');
    b.addEventListener('click', function () {
      var text = getText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash(b, true); },
          function () { flash(b, fallback(text)); });
      } else { flash(b, fallback(text)); }
    });
    return b;
  }
  function init() {
    Array.prototype.forEach.call(document.querySelectorAll('pre'), function (pre) {
      if (pre.querySelector('.cpb')) return;
      var text = pre.textContent.replace(/\s+$/, '');
      if (!isCommandBlock(text)) return;
      pre.style.position = 'relative';
      pre.appendChild(makeButton(function () {
        var c = pre.cloneNode(true), x = c.querySelector('.cpb');
        if (x) x.parentNode.removeChild(x);
        return c.textContent.replace(/\s+$/, '');
      }));
    });
    Array.prototype.forEach.call(document.querySelectorAll('code'), function (code) {
      if (code.closest('pre') || (code.nextSibling && code.nextSibling.className === 'cpb')) return;
      var t = code.textContent.trim();
      if (!CMD.test(t) || t.indexOf('\n') >= 0) return;
      code.parentNode.insertBefore(makeButton(function () { return t; }), code.nextSibling);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
